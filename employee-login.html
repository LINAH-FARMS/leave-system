<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الموظف</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/supabase-client.js"></script>
  <script src="assets/employees-data.js"></script>
  <script src="assets/auth.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo"><img src="assets/logo.png" alt="Logo"></div>
      <h2>تسجيل دخول الموظف</h2>
      <p style="text-align:center;color:#666;margin-bottom:15px;font-size:13px;">أدخل كودك الوظيفي والرقم السري</p>
      <div class="form-group">
        <label>👤 الكود الوظيفي</label>
        <input type="number" id="empCode" placeholder="مثال: 21" autofocus>
      </div>
      <div class="form-group">
        <label>🔒 الرقم السري</label>
        <input type="password" id="password" placeholder="أدخل الرقم السري">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">دخول</button>
      <div id="error" class="login-error"></div>
      <div style="text-align:center;margin-top:15px;">
        <a href="index.html" style="color:#2e7d32;font-size:13px;">← رجوع</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="roleModal" style="display:none;">
    <div class="modal" style="text-align:center;">
      <h3 style="margin-bottom:20px;">اختر طريقة الدخول</h3>
      <button class="btn btn-primary" style="width:100%;margin-bottom:10px;padding:12px;font-size:15px;" onclick="enterAsEmployee()">👤 دخول كموظف</button>
      <button class="btn btn-success" style="width:100%;margin-bottom:10px;padding:12px;font-size:15px;" id="managerEntryBtn" onclick="enterAsManager()">👔 دخول كمدير</button>
      <button class="btn btn-outline" style="width:100%;padding:12px;font-size:15px;" onclick="cancelRoleChoice()">إلغاء</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dept = params.get('dept') || '';

    // QR-direct access: redirect to manager dashboard without login
    if (dept && !params.get('mode')) {
      window.location.href = 'manager-dashboard.html?dept=' + encodeURIComponent(dept);
      // stop execution after redirect
    }

    let _lastSession = null;

    async function doLogin() {
      const code = document.getElementById('empCode').value.trim();
      const pw = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      errEl.textContent = '';

      if (!code || !pw) { errEl.textContent = '✗ أدخل الكود الوظيفي والرقم السري'; return; }

      const result = await login(code, pw);
      if (!result.success) {
        errEl.textContent = result.message;
        return;
      }

      const s = result.session;
      const canManage = s.is_manager || s.is_hr;

      if (canManage) {
        _lastSession = s;
        document.getElementById('managerEntryBtn').textContent = (s.is_hr ? '👑 دخول كمدير التطبيق' : '👔 دخول كمدير');
        document.getElementById('roleModal').style.display = 'flex';
      } else {
        window.location.href = 'employee-form.html';
      }
    }

    function enterAsEmployee() {
      window.location.href = 'employee-form.html';
    }

    function enterAsManager() {
      const s = _lastSession;
      if (s.is_hr) window.location.href = 'hr-dashboard.html';
      else window.location.href = 'manager-dashboard.html' + (dept ? '?dept=' + encodeURIComponent(dept) : '');
    }

    function cancelRoleChoice() {
      document.getElementById('roleModal').style.display = 'none';
      logout();
      _lastSession = null;
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
