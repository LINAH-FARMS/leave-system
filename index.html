<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الإجازات</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/employees-data.js"></script>
  <script src="assets/auth.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card" style="text-align:center;">
      <div class="logo"><img src="assets/logo.png" alt="Logo"></div>
      <h2>نظام إدارة الإجازات</h2>
      <p style="color:#666;margin-bottom:20px;">HR Leave Management System</p>
      <div id="role-section">
        <p style="margin-bottom:15px;color:#555;">تم التعرف على دورك من QR code</p>
        <div id="role-badge" style="margin-bottom:20px;"></div>
        <a href="employee-login.html" class="btn btn-primary" style="width:100%;margin-bottom:8px;">دخول الموظف</a>
        <a href="manager-dashboard.html" class="btn btn-outline" style="width:100%;margin-bottom:8px;">دخول المدير</a>
        <a href="hr-dashboard.html" class="btn btn-outline" style="width:100%;">دخول الموارد البشرية</a>
      </div>
      <div style="margin-top:25px;padding-top:20px;border-top:1px solid #eee;font-size:12px;color:#999;">
        QR Code: <span id="qr-param">—</span>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    const dept = params.get('dept');
    document.getElementById('qr-param').textContent = role ? (role + (dept ? ' / ' + dept : '')) : '—';

    if (role === 'employee' && dept) {
      document.getElementById('role-badge').innerHTML =
        '<span style="background:#e8f5e9;padding:8px 20px;border-radius:20px;color:#2e7d32;">👤 موظف - ' + dept + '</span>';
      document.querySelector('a[href="employee-login.html"]').href = 'employee-login.html?dept=' + encodeURIComponent(dept);
      document.querySelector('a[href="employee-login.html"]').className = 'btn btn-primary';
      document.querySelector('a[href="manager-dashboard.html"]').style.display = 'none';
      document.querySelector('a[href="hr-dashboard.html"]').style.display = 'none';
    } else if (role === 'manager' && dept) {
      document.getElementById('role-badge').innerHTML =
        '<span style="background:#e3f2fd;padding:8px 20px;border-radius:20px;color:#1565c0;">👔 مدير - ' + dept + '</span>';
      document.querySelector('a[href="employee-login.html"]').style.display = 'none';
      document.querySelector('a[href="manager-dashboard.html"]').href = 'manager-dashboard.html?dept=' + encodeURIComponent(dept);
      document.querySelector('a[href="manager-dashboard.html"]').className = 'btn btn-primary';
      document.querySelector('a[href="hr-dashboard.html"]').style.display = 'none';
    } else if (role === 'hr') {
      document.getElementById('role-badge').innerHTML =
        '<span style="background:#fce4ec;padding:8px 20px;border-radius:20px;color:#c62828;">👑 الموارد البشرية</span>';
      document.querySelector('a[href="employee-login.html"]').style.display = 'none';
      document.querySelector('a[href="manager-dashboard.html"]').style.display = 'none';
      document.querySelector('a[href="hr-dashboard.html"]').href = 'hr-dashboard.html';
      document.querySelector('a[href="hr-dashboard.html"]').className = 'btn btn-primary';
    } else {
      document.getElementById('role-badge').innerHTML = 'امسح QR code مخصص';
    }
  </script>
</body>
</html>
