<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الموارد البشرية</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/employees-data.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/leave-utils.js"></script>
</head>
<body>
  <div class="header">
    <h1>👑 لوحة الموارد البشرية</h1>
    <div class="user-info" id="userInfo"></div>
  </div>
  <div class="container">
    <div id="loginPrompt" style="display:none;text-align:center;padding:40px;">
      <p style="font-size:18px;">🔒 يجب تسجيل الدخول كـ HR</p>
      <a href="employee-login.html" class="btn btn-primary" style="margin-top:15px;">تسجيل الدخول</a>
    </div>

    <div id="dashboardArea" style="display:none;">
      <!-- Stats -->
      <div class="stats" id="statsArea"></div>

      <!-- Filters -->
      <div class="card">
        <h2>🔍 فلترة الطلبات</h2>
        <div class="filter-bar">
          <div class="form-group">
            <label>الإدارة</label>
            <select id="filterDept" onchange="loadAll()">
              <option value="all">كل الإدارات</option>
              <option value="زراعه">زراعه</option>
              <option value="فنيه">فنيه</option>
              <option value="مخازن">مخازن</option>
              <option value="الشئون الاداريه">الشئون الاداريه</option>
              <option value="الموارد البشريه">الموارد البشريه</option>
              <option value="امن">امن</option>
              <option value="ميكنه">ميكنه</option>
            </select>
          </div>
          <div class="form-group">
            <label>الحالة</label>
            <select id="filterStatus" onchange="loadAll()">
              <option value="all">كل الحالات</option>
              <option value="pending">🟡 قيد الانتظار</option>
              <option value="approved_by_manager">🟢 موافقة مدير</option>
              <option value="rejected_by_manager">🔴 مرفوض من مدير</option>
              <option value="approved_by_hr">✅ معتمد HR</option>
              <option value="rejected_by_hr">❌ مرفوض HR</option>
            </select>
          </div>
          <div class="form-group">
            <label>من تاريخ</label>
            <input type="date" id="filterFrom" onchange="loadAll()">
          </div>
          <div class="form-group">
            <label>إلى تاريخ</label>
            <input type="date" id="filterTo" onchange="loadAll()">
          </div>
          <button class="btn btn-primary" onclick="loadAll()">🔍 بحث</button>
          <button class="btn btn-outline" onclick="exportExcel()">📤 تصدير Excel</button>
        </div>
      </div>

      <!-- Requests Table -->
      <div class="card">
        <h2>📋 جميع طلبات الإجازات</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>الموظف</th>
                <th>الإدارة</th>
                <th>النوع</th>
                <th>المدة</th>
                <th>أيام</th>
                <th>رقم الموبايل</th>
                <th>السبب</th>
                <th>المدير</th>
                <th>HR</th>
                <th>الحالة</th>
                <th>تاريخ الطلب</th>
                <th>الإجراء</th>
              </tr>
            </thead>
            <tbody id="allRequestsBody">
              <tr><td colspan="13" style="text-align:center;color:#999;">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="nav-bar">
        <a href="manager-dashboard.html" class="btn btn-outline btn-sm">👔 لوحة المدير</a>
        <a href="#" class="btn btn-outline btn-sm" onclick="logout()">🚪 خروج</a>
      </div>
    </div>
  </div>

  <!-- HR Action Modal -->
  <div class="modal-overlay" id="hrModal">
    <div class="modal">
      <h3 id="hrModalTitle">👑 إجراء HR</h3>
      <p id="hrModalInfo" style="margin-bottom:12px;"></p>
      <div class="form-group">
        <label>ملاحظات HR</label>
        <textarea id="hrModalComment" rows="3" placeholder="ملاحظات الموارد البشرية"></textarea>
      </div>
      <div class="btn-group">
        <button class="btn btn-success" onclick="hrApprove()">✅ اعتماد نهائي</button>
        <button class="btn btn-danger" onclick="hrReject()">❌ رفض</button>
        <button class="btn btn-outline" onclick="closeHrModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const session = requireAuth(['any']);
    let currentHrLeaveId = null;

    if (session) {
      if (!session.is_hr) {
        document.getElementById('loginPrompt').style.display = 'block';
        document.getElementById('dashboardArea').style.display = 'none';
        document.getElementById('loginPrompt').innerHTML =
          '<p style="font-size:18px;margin-bottom:15px;">🔒 هذه الصفحة مخصصة للموارد البشرية فقط</p>' +
          '<a href="employee-login.html" class="btn btn-primary">تسجيل الدخول</a>';
      } else {
        document.getElementById('dashboardArea').style.display = 'block';
        document.getElementById('userInfo').textContent = session.name + ' | HR';
        loadAll();
      }
    } else {
      document.getElementById('loginPrompt').style.display = 'block';
    }

    async function loadAll() {
      const filters = {
        department: document.getElementById('filterDept').value,
        status: document.getElementById('filterStatus').value,
        from_date: document.getElementById('filterFrom').value,
        to_date: document.getElementById('filterTo').value
      };

      const leaves = await fetchAllLeaves(filters);

      // Stats
      const total = leaves.length;
      const pending = leaves.filter(l => l.status === 'pending').length;
      const mgrApproved = leaves.filter(l => l.status === 'approved_by_manager').length;
      const hrApproved = leaves.filter(l => l.status === 'approved_by_hr').length;
      document.getElementById('statsArea').innerHTML =
        '<div class="stat-card"><div class="num">' + total + '</div><div class="lbl">إجمالي</div></div>' +
        '<div class="stat-card"><div class="num">' + pending + '</div><div class="lbl">معلق</div></div>' +
        '<div class="stat-card"><div class="num">' + mgrApproved + '</div><div class="lbl">موافقة مدير</div></div>' +
        '<div class="stat-card"><div class="num">' + hrApproved + '</div><div class="lbl">معتمد HR</div></div>';

      if (leaves.length === 0) {
        document.getElementById('allRequestsBody').innerHTML =
          '<tr><td colspan="13" style="text-align:center;color:#999;">لا توجد طلبات</td></tr>';
        return;
      }

      document.getElementById('allRequestsBody').innerHTML = leaves.map(l => {
        const rowClass = l.status === 'pending' ? 'background:#fffde7;' :
                        l.status === 'approved_by_manager' ? 'background:#e8f5e9;' : '';
        return '<tr style="' + rowClass + '">' +
          '<td>' + l.id + '</td>' +
          '<td><strong>' + l.full_name + '</strong><br><span style="font-size:11px;color:#666;">' + l.emp_code + '</span></td>' +
          '<td><span class="dept-tag" style="background:' + getDeptColor(l.department) + ';">' + l.department + '</span></td>' +
          '<td>' + leaveTypeAr(l.leave_type) + '</td>' +
          '<td>' + formatDate(l.start_date) + '<br><span style="font-size:11px;color:#666;">→ ' + formatDate(l.end_date) + '</span></td>' +
          '<td>' + l.days_count + '</td>' +
          '<td>' + (l.phone || '—') + '</td>' +
          '<td style="font-size:12px;max-width:120px;">' + (l.reason || '—') + '</td>' +
          '<td style="font-size:11px;">' + (l.manager_comment || '—') + '</td>' +
          '<td style="font-size:11px;">' + (l.hr_comment || '—') + '</td>' +
          '<td>' + statusBadge(l.status) + '</td>' +
          '<td style="font-size:11px;">' + formatDate(l.created_at ? l.created_at.split('T')[0] : '') + '</td>' +
          '<td>' + hrActions(l) + '</td>' +
        '</tr>';
      }).join('');
    }

    function getDeptColor(dept) {
      const colors = {
        'زراعه': '#4CAF50',
        'فنيه': '#2196F3',
        'مخازن': '#FF9800',
        'الشئون الاداريه': '#9C27B0',
        'الموارد البشريه': '#E91E63',
        'امن': '#607D8B',
        'ميكنه': '#795548'
      };
      return colors[dept] || '#999';
    }

    function hrActions(l) {
      if (l.status === 'approved_by_manager') {
        return '<button class="btn btn-success btn-sm" onclick="openHrModal(' + l.id + ',\'' + l.full_name.replace(/'/g, "\\'") + '\')">👑 اعتماد</button>';
      }
      if (l.status === 'pending') {
        return '<span style="font-size:11px;color:#e65100;">بانتظار المدير</span>';
      }
      return '<span style="font-size:11px;color:#999;">—</span>';
    }

    function openHrModal(id, name) {
      currentHrLeaveId = id;
      document.getElementById('hrModalTitle').textContent = '👑 اعتماد إجازة - ' + name;
      document.getElementById('hrModalInfo').textContent = 'رقم الطلب: ' + id;
      document.getElementById('hrModal').style.display = 'flex';
      document.getElementById('hrModalComment').value = '';
    }

    function closeHrModal() {
      document.getElementById('hrModal').style.display = 'none';
      currentHrLeaveId = null;
    }

    async function hrApprove() {
      if (!currentHrLeaveId) return;
      const comment = document.getElementById('hrModalComment').value;
      await updateLeaveStatus(currentHrLeaveId, 'approved_by_hr', comment, session.emp_code);
      closeHrModal();
      loadAll();
    }

    async function hrReject() {
      if (!currentHrLeaveId) return;
      const comment = document.getElementById('hrModalComment').value || 'مرفوض من HR';
      await updateLeaveStatus(currentHrLeaveId, 'rejected_by_hr', comment, session.emp_code);
      closeHrModal();
      loadAll();
    }

    function exportExcel() {
      // Simple CSV export from current table data
      const rows = document.querySelectorAll('#allRequestsBody tr');
      let csv = 'الموظف,الإدارة,النوع,من,إلى,أيام,رقم الموبايل,السبب,الحالة,تاريخ الطلب\n';
      rows.forEach(row => {
        const cols = row.querySelectorAll('td');
        if (cols.length > 2) {
          const name = cols[1]?.textContent?.trim().split('\n')[0] || '';
          const dept = cols[2]?.textContent?.trim() || '';
          const type = cols[3]?.textContent?.trim() || '';
          const period = cols[4]?.textContent?.trim().replace('→', ' → ') || '';
          const days = cols[5]?.textContent?.trim() || '';
          const phone = cols[6]?.textContent?.trim() || '';
          const reason = cols[7]?.textContent?.trim() || '';
          const status = cols[10]?.textContent?.trim() || '';
          const date = cols[11]?.textContent?.trim() || '';
          csv += `${name},${dept},${type},${period},${days},${phone},${reason},${status},${date}\n`;
        }
      });
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'اجازات_' + new Date().toISOString().split('T')[0] + '.csv';
      link.click();
    }
  </script>
</body>
</html>
